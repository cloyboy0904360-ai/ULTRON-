[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "0.2.0"
description = "ULTRON business operating system: core operations controller, revenue engine and integration adapters."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["ultron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
