name: CI

on:
  push:
    branches: [main, ultron/implementation-workstreams]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# NOTE: this repository's Actions policy only permits actions owned by
# cloyboy0904360-ai, so this workflow deliberately uses no external
# actions. Source checkout is done with git directly (authenticated via
# gh) and the preinstalled runner Python is used.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Show Python version
        run: python3 --version

      - name: Install dependencies
        run: python3 -m pip install --user -r requirements-dev.txt

      - name: Compile application and scripts
        run: python3 -m compileall -q ultron scripts

      - name: Run full test suite
        run: python3 -m pytest

      - name: Install dependency security scanner
        run: python3 -m pip install --user pip-audit

      - name: Audit runtime and development dependencies
        run: $HOME/.local/bin/pip-audit -r requirements-dev.txt

      - name: Validate Compose configuration
        env:
          ULTRON_API_KEYS: ci-only-placeholder
        run: docker compose -f compose.yaml config --quiet

      - name: Build production container
        run: docker build --tag ultron:ci .

      - name: Smoke-test live API and SQLite persistence
        run: |
          set -euo pipefail
          docker volume create ultron-ci-data >/dev/null
          cleanup() {
            docker rm -f ultron-ci >/dev/null 2>&1 || true
            docker volume rm ultron-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name ultron-ci --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 8000:8000 \
            -e ULTRON_ENV=production \
            -e ULTRON_API_KEYS='ci-test-key:operations:read,operations:write' \
            -e ULTRON_DATABASE_PATH=/data/ultron.db \
            -v ultron-ci-data:/data ultron:ci >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          curl -fsS -H 'X-API-Key: ci-test-key' http://127.0.0.1:8000/agents > /tmp/ultron-agents.json
          python3 -c "import json; assert len(json.load(open('/tmp/ultron-agents.json'))) == 7"
          curl -fsS -X POST http://127.0.0.1:8000/operations \
            -H 'X-API-Key: ci-test-key' -H 'Content-Type: application/json' \
            -d '{"description":"container persistence smoke test","owner":"OPS"}' > /tmp/ultron-operation.json
          operation_id=$(python3 -c "import json; print(json.load(open('/tmp/ultron-operation.json'))['id'])")
          docker restart ultron-ci >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -H 'X-API-Key: ci-test-key' \
            "http://127.0.0.1:8000/operations/$operation_id" > /tmp/ultron-persisted-operation.json
          python3 -c "import json; assert json.load(open('/tmp/ultron-persisted-operation.json'))['id'] == '$operation_id'"
