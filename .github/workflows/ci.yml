name: CI

on:
  push:
    branches: [main, ultron/implementation-workstreams]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

# NOTE: this repository's Actions policy only permits actions owned by
# cloyboy0904360-ai, so this workflow deliberately uses no external
# actions. Source checkout is done with git directly (authenticated via
# gh) and the preinstalled runner Python is used.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Show Python version
        run: python3 --version

      - name: Install dependencies
        run: python3 -m pip install --user -r requirements-dev.txt

      - name: Compile application and scripts
        run: python3 -m compileall -q ultron scripts

      - name: Run full test suite
        run: python3 -m pytest

      - name: Install dependency security scanner
        run: python3 -m pip install --user pip-audit

      - name: Audit runtime and development dependencies
        run: $HOME/.local/bin/pip-audit -r requirements-dev.txt
