name: GitHub PR review to Asana
on:
  pull_request:
    types: [review_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: number
      dry_run:
        description: Validate the PR and workflow without creating an Asana task
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: asana-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  create-asana-follow-up:
    runs-on: ubuntu-latest
    steps:
      - name: Validate event and PR context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "null" ]]; then
            echo "::error::No pull request number was supplied."
            exit 1
          fi
          PR_JSON="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.title' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r '.user.login' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r '.state' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "Validated PR #${PR_NUMBER} in ${REPOSITORY}."
      - name: Dry-run verification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "DRY RUN PASSED: pull request context is readable."
          echo "No Asana task was created and no external changes were made."
      - name: Require Asana credential
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: |
          if [[ -z "${ASANA_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing repository secret ASANA_ACCESS_TOKEN. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Create exactly-once Asana follow-up
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.number }}
          PR_TITLE: ${{ steps.context.outputs.title }}
          PR_URL: ${{ steps.context.outputs.url }}
          PR_AUTHOR: ${{ steps.context.outputs.author }}
          REVIEWER: ${{ github.event.requested_reviewer.login || 'unspecified' }}
          WORKSPACE_GID: "1217093232814223"
          ASSIGNEE_GID: "1217093232814211"
        run: |
          set -euo pipefail
          MARKER="asana-pr-review:${REPOSITORY}#${PR_NUMBER}"
          COMMENTS="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          if jq -e --arg marker "$MARKER" '[.[] | select(.body | contains($marker))] | length > 0' <<< "$COMMENTS" >/dev/null; then
            echo "An Asana task marker already exists for ${MARKER}; skipping duplicate creation."
            exit 0
          fi
          NOTES="GitHub pull request review follow-up\n\nRepository: ${REPOSITORY}\nPull request: ${PR_URL}\nAuthor: ${PR_AUTHOR}\nRequested reviewer: ${REVIEWER}\n\nReview the description, changed files, tests, security implications, and merge readiness. Record findings in GitHub before approving or requesting changes.\n\nIdempotency marker: ${MARKER}"
          PAYLOAD="$(jq -n --arg name "Review PR #${PR_NUMBER}: ${PR_TITLE}" --arg notes "$NOTES" --arg workspace "$WORKSPACE_GID" --arg assignee "$ASSIGNEE_GID" '{data:{name:$name,notes:$notes,workspace:$workspace,assignee:$assignee}}')"
          RESPONSE="$(curl --fail-with-body --silent --show-error -X POST "https://app.asana.com/api/1.0/tasks" -H "Authorization: Bearer ${ASANA_ACCESS_TOKEN}" -H "Content-Type: application/json" --data "$PAYLOAD")"
          TASK_URL="$(jq -r '.data.permalink_url // empty' <<< "$RESPONSE")"
          TASK_GID="$(jq -r '.data.gid // empty' <<< "$RESPONSE")"
          if [[ -z "$TASK_GID" ]]; then
            echo "::error::Asana did not return a task GID."
            exit 1
          fi
          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="Asana follow-up created: ${TASK_URL:-https://app.asana.com/0/0/0}\n\n<!-- ${MARKER} -->" >/dev/null
          echo "Created Asana task ${TASK_GID} for PR #${PR_NUMBER}."
