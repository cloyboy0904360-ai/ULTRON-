name: GitHub PR review to Asana

# Processes SUBMITTED pull request reviews and creates an Asana
# follow-up task for reviews that require changes or contain actionable
# inline comments. Approved/dismissed reviews create nothing.
#
# Delivery semantics: at-least-once from GitHub with idempotent
# processing per (repository, PR, review id) via a hidden marker comment.
# This is NOT exactly-once; a crash between Asana creation and the marker
# comment can duplicate a task. The concurrency group below prevents
# simultaneous processing of the same review.
#
# NOTE: this repository's Actions policy only permits actions owned by
# cloyboy0904360-ai, so this workflow uses no external actions. The
# processing script is fetched from the DEFAULT BRANCH only — never from
# the pull request head — so no untrusted PR code is executed.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to process or replay
        required: true
        type: number
      review_id:
        description: Review id (optional; defaults to the latest submitted review)
        required: false
        type: number
      dry_run:
        description: Validate everything without creating an Asana task
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: asana-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.review.id || inputs.review_id || 'latest' }}
  cancel-in-progress: false

jobs:
  process-review:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch processing script from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p scripts
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/pr_review_to_asana.py?ref=${DEFAULT_BRANCH}" \
            -H "Accept: application/vnd.github.raw+json" > scripts/pr_review_to_asana.py
          python3 -m py_compile scripts/pr_review_to_asana.py

      - name: Process submitted review
        id: process
        env:
          GH_TOKEN: ${{ github.token }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ vars.ASANA_WORKSPACE_GID }}
          ASANA_PROJECT_GID: ${{ vars.ASANA_PROJECT_GID }}
        run: python3 scripts/pr_review_to_asana.py

      - name: Preserve failed event for recovery
        if: failure()
        run: |
          set -euo pipefail
          if [ -f asana-recovery.json ]; then
            {
              echo "### Asana review-processing failure — recovery record"
              echo
              echo '```json'
              cat asana-recovery.json
              echo
              echo '```'
              echo
              echo "Replay with: Actions → GitHub PR review to Asana → Run workflow → pr_number, review_id."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
