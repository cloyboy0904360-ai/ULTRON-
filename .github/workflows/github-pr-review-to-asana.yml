name: GitHub PR review to Asana

# Processes SUBMITTED pull request reviews and creates an Asana
# follow-up task for reviews that require changes or contain actionable
# inline comments. Approved/dismissed reviews create nothing.
#
# Delivery semantics: at-least-once from GitHub with idempotent
# processing per (repository, PR, review id) via a hidden marker comment.
# This is NOT exactly-once; a crash between Asana creation and the marker
# comment can duplicate a task. The concurrency group below prevents
# simultaneous processing of the same review.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to process or replay
        required: true
        type: number
      review_id:
        description: Review id (optional; defaults to the latest submitted review)
        required: false
        type: number
      dry_run:
        description: Validate everything without creating an Asana task
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: asana-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.review.id || inputs.review_id || 'latest' }}
  cancel-in-progress: false

jobs:
  process-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow scripts from the default branch
        uses: actions/checkout@v4
        with:
          # Never check out the PR head: only trusted default-branch code runs.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process submitted review
        id: process
        env:
          GH_TOKEN: ${{ github.token }}
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_WORKSPACE_GID: ${{ vars.ASANA_WORKSPACE_GID }}
          ASANA_PROJECT_GID: ${{ vars.ASANA_PROJECT_GID }}
        run: python3 scripts/pr_review_to_asana.py

      - name: Preserve failed event for recovery
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asana-review-recovery-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event.review.id || inputs.review_id || 'latest' }}
          path: asana-recovery.json
          if-no-files-found: ignore
